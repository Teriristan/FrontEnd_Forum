<link rel="stylesheet" href="../style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <div class="logo">Ruang<span>Rame</span></div>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="../kategori.html">Kategori</a> 
      <a href="../threads.html">Thread</a>
      <a href="../orang 3/tag-populer.html">Tag</a>

      <a href="../orang 4/leaderboard.html">Leaderboard</a>
    </div>
    <button class="hamburger"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / FAQ & Panduan</div>
    <h1>❓ FAQ & Panduan Forum</h1>
  </div>
</div>

<section class="section container" style="max-width:750px;">
  <div id="faqBox"></div>
</section>

<footer>
  © 2026 RuangRame — Project UTS Kelompok Forum Untar. <a href="about.html" style="color:var(--text-dim);">Tentang</a> · <a href="faq.html" style="color:var(--text-dim);">FAQ</a> · <a href="terms.html" style="color:var(--text-dim);">Peraturan</a> · <a href="orang 4/moderasi.html" style="color:var(--text-dim);">Panel Moderasi</a>
</footer>

<script src="script.js"></script>
<script>
  const faqData = [
    { q: "Apakah saya perlu daftar akun untuk membaca thread?", a: "Tidak. Semua thread bisa dibaca secara bebas tanpa perlu login atau membuat akun." },
    { q: "Bagaimana cara membuat thread baru?", a: "Klik tombol \"+ Thread Baru\" di halaman daftar thread, lalu isi judul, kategori, dan isi thread kamu." },
    { q: "Apa itu cendol dan reputasi?", a: "Cendol adalah poin apresiasi dari member lain terhadap kontribusi kamu di forum. Semakin banyak cendol, level reputasi kamu di leaderboard akan naik." },
    { q: "Bagaimana cara melaporkan konten yang melanggar?", a: "Gunakan tombol laporkan di setiap thread. Laporan kamu akan masuk ke Panel Moderasi untuk ditinjau oleh tim moderator." },
    { q: "Apakah forum ini menyimpan data pribadi saya?", a: "Tidak. Project ini dibuat tanpa database, sehingga tidak ada data pengguna yang disimpan secara permanen di server." },
    { q: "Bagaimana cara mencari thread tertentu?", a: "Gunakan kolom pencarian di navbar untuk mencari berdasarkan judul thread, atau jelajahi berdasarkan kategori maupun tag topik." },
  ];

  const faqBox = document.getElementById("faqBox");
  faqBox.innerHTML = faqData.map((f, i) => `
    <div class="card faq-item" data-index="${i}">
      <div class="faq-question">
        ${f.q}
        <span class="faq-arrow">▼</span>
      </div>
      <div class="faq-answer"><p>${f.a}</p></div>
    </div>
  `).join("");

  document.querySelectorAll(".faq-question").forEach(q => {
    q.addEventListener("click", () => {
      q.closest(".faq-item").classList.toggle("open");
    });
  });
</script>
</body>
</html>
