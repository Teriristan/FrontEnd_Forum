<script src="script.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const tagId = params.get("tag");
  const tag = tagData.find(t => t.id === tagId);

  if (tag) {
    document.getElementById("tagTitle").textContent = "#" + tag.nama;
    document.getElementById("tagNameLabel").textContent = tag.nama;
  } else {
    document.getElementById("tagTitle").textContent = "Tag tidak ditemukan";
  }

  const box = document.getElementById("tagThreadBox");
  if (tagId) {
    renderThreadsByTag(box, tagId);
  } else {
    box.innerHTML = `<p style="color:var(--text-dim);padding:20px;">Tag tidak ditemukan.</p>`;
  }
</script>
